<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lean Infoview</title>
    <link rel="stylesheet" href="/vscode-theme.css" />
    <link rel="stylesheet" href="/imports/index.css" />
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; }
      #bar {
        display: flex; align-items: center; gap: 4px;
        padding: 2px 6px 2px 10px; flex: 0 0 auto;
        font: 12px -apple-system, system-ui, sans-serif;
        border-bottom: 1px solid rgba(128,128,128,.25);
        user-select: none;
      }
      #bar .ttl { color: #888; font-weight: 600; }
      #bar .key {
        color: #999; font-weight: 500; opacity: .8;
        border: 1px solid rgba(128,128,128,.28); border-radius: 4px;
        padding: 0 5px; margin-left: 6px; font-size: 11px;
      }
      #bar .sp { flex: 1; }
      #bar button {
        border: 1px solid rgba(128,128,128,.3); background: transparent;
        color: inherit; border-radius: 5px; padding: 1px 8px; cursor: pointer;
        font-size: 13px; line-height: 1.4;
      }
      #bar button:hover { background: rgba(128,128,128,.15); }
      #bar button.off { opacity: .45; }
      #infoview { flex: 1 1 auto; overflow: auto; padding: 6px 10px; box-sizing: border-box; }
      .gv-status { font: 12px -apple-system, system-ui, sans-serif; color: #888; padding: 10px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <span class="ttl">Lean Infoview</span>
      <span class="key" title="Reopen or summon this window from Zed">⌘⌥I</span>
      <span class="sp"></span>
      <button id="pin" title="Float on top / send behind (⌘T)">📌 Float</button>
      <button id="min" title="Minimize">—</button>
    </div>
    <div id="infoview"><div class="gv-status">Connecting to Lean…</div></div>
    <script>
      // The control bar talks to the native window over wry IPC. Everything
      // lives in an IIFE: wry's own injected script declares a lexical `ipc`
      // in the global scope, and a top-level `const ipc` here collided with
      // it — a SyntaxError that silently killed this whole script block
      // (dead buttons). Block scope, and no global names of our own.
      (() => {
        const send = (m) => window.ipc && window.ipc.postMessage(m)
        const wire = () => {
          const pin = document.getElementById('pin')
          let floating = true
          pin.onclick = () => {
            floating = !floating
            pin.classList.toggle('off', !floating)
            pin.textContent = floating ? '📌 Float' : '📍 Behind'
            send('toggle-float')
          }
          document.getElementById('min').onclick = () => send('minimize')
        }
        if (document.readyState === 'loading') {
          window.addEventListener('DOMContentLoaded', wire)
        } else {
          wire()
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
